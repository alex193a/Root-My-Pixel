name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk 37 requires platform android-37
          api-level: 37
          cache: true

      - name: Install NDK required by AGP 9.3.1
        # AGP 9.3.1 uses NDK 28.2.13676358 as default android.ndkVersion.
        # GitHub runners pre-install a different NDK and export ANDROID_NDK_HOME to it,
        # so install the exact version AGP wants and point ANDROID_NDK_HOME at it.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build native helper and exploit payloads
        # Regenerates jniLibs/libcve43499root.so and assets/exploits/*.so from
        # source for every entry in build-all.sh's TARGETS list, so the list
        # stays the single source of truth for which devices get a payload.
        run: |
          chmod +x ./build-all.sh
          ./build-all.sh --payloads-only

      - name: Upload exploit payloads
        uses: actions/upload-artifact@v4
        with:
          name: exploit-payloads
          path: |
            app/src/main/assets/exploits/*.so
            app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "APK size: $(stat -c%s "$APK") bytes"
          ls -la "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
